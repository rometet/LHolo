name: Apply verified manual placement changes
on:
  push:
    branches: [fix/manual-placement-compatibility-20260925]
    paths: [.github/workflows/apply-manual-placement-audit.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'rometet/LHolo' && github.ref == 'refs/heads/fix/manual-placement-compatibility-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact baseline and patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 84a88b0a8c6cc20b5ce95546fefca3cecb99f811 HEAD -- src tests docs xmake.lua
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path('.lholo-audit')
          text = ''.join((root / f'manual-placement-patch.{i:02d}').read_text() for i in (1, 2, 3))
          patch = gzip.decompress(base64.b64decode(''.join(text.split()), validate=True))
          expected = '781bdb718474dab68f37e2f8c24947593337dff771a7c7d9b6a76c710f5ffbfc'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch digest mismatch'
          pathlib.Path('/tmp/manual-placement.patch').write_bytes(patch)
          PY
          export GIT_INDEX_FILE=/tmp/lholo-verified-index
          git read-tree 84a88b0a8c6cc20b5ce95546fefca3cecb99f811
          git apply --cached /tmp/manual-placement.patch
          test "$(git write-tree)" = 60cdf216c1f5819f07fe8b26e68bd372f82ce690
          unset GIT_INDEX_FILE
          git apply --check /tmp/manual-placement.patch
          git apply /tmp/manual-placement.patch
      - name: Test actual policy and session code
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -Isrc tests/manual_placement/portable_main.cpp src/place/PlacementState.cpp -o /tmp/manual-placement-tests
          /tmp/manual-placement-tests
          git diff --check
      - name: Commit only reviewed source changes to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs/MANUAL_PLACEMENT_AUDIT.md
          git commit -m 'fix: manual placement compatibility and per-client block exceptions'
          git push origin HEAD:refs/heads/fix/manual-placement-compatibility-20260925
          git rev-parse HEAD
