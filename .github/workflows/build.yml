on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: |
          xmake -v -y

      - name: Build logic tests
        run: |
          xmake -v -y LHoloLogicTests

      - name: Run logic tests
        run: |
          xmake run LHoloLogicTests

      - name: Run P0 and bubble-column regressions
        run: |
          python tests/regression/run_tests.py

      - name: Run manual placement portable tests
        run: |
          clang++ -std=c++20 -O2 -Isrc tests/manual_placement/portable_main.cpp src/place/PlacementState.cpp -o build/regression/manual-placement-tests.exe
          .\build\regression\manual-placement-tests.exe

      - name: Run Candidate D1 native UV tests
        run: |
          clang++ -std=c++20 -O2 -Isrc tests/diagnostics/liquid_native_uv_d1_tests.cpp -o build/regression/liquid-native-uv-d1-tests.exe
          .\build\regression\liquid-native-uv-d1-tests.exe

      - uses: actions/upload-artifact@v7
        with:
          name: LHolo-Candidate-D1-${{ github.sha }}-client-windows-x64
          path: |
            bin/
