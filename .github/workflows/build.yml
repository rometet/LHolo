on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}

      - name: Install verified LLVM 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-22.1.8'
          $llvmUrl = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe'
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Invoke-WebRequest -Uri $llvmUrl -OutFile $installer -ErrorAction Stop
              break
            } catch {
              $detail = $_.Exception.Message
              $transient = $detail -match '(?i)(429|50[0234]|gateway time-out|timed out|timeout|connection reset|connection closed|failed to connect)'
              if (-not $transient -or $attempt -eq 4) { throw }
              Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
              $delay = 25 * $attempt
              Write-Warning "LLVM download transient failure (attempt $attempt): $detail; retry in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          $expected = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'LLVM installer checksum mismatch'
          }
          $install = Start-Process -FilePath $installer -ArgumentList "/S /D=$llvmRoot" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
          $llvmBin = Join-Path $llvmRoot 'bin'
          $version = (& (Join-Path $llvmBin 'clang-cl.exe') --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'clang version 22\.1\.8(?:\s|$)') {
            throw "Unexpected LLVM compiler: $version"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: |
          xmake repo -u

      - name: Resolve client dependencies (retry transient download errors)
        shell: pwsh
        run: |
          # Xmake's release asset downloads can intermittently return HTTP 5xx.
          # Retry *only* recognized transient network errors; compilation and
          # package/configuration errors must still fail immediately.
          $ErrorActionPreference = 'Continue'
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Xmake dependency resolution attempt $attempt/$maxAttempts"
            $configOutput = @()
            & xmake f -a x64 -m release -p windows -v --target_type=client -y 2>&1 |
              Tee-Object -Variable configOutput
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { exit 0 }

            $combined = $configOutput -join "`n"
            $transient = $combined -match '(?i)(status=(429|500|502|503|504)|timed out|timeout|connection reset|failed to connect|could not resolve host|SSL connect error)'
            if (-not $transient -or $attempt -eq $maxAttempts) {
              Write-Error "Xmake failed (exit $exitCode). Transient network failure: $transient."
              exit $exitCode
            }
            $delay = 25 * $attempt
            Write-Warning "Transient package download failure; retrying in $delay seconds."
            Start-Sleep -Seconds $delay
          }

      - run: |
          xmake -v -y

      - name: Build logic tests
        run: |
          xmake -v -y LHoloLogicTests

      - name: Run logic tests
        run: |
          xmake run LHoloLogicTests

      - name: Build and run NBT parser tests
        run: |
          xmake -v -y LHoloNbtTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloNbtTests

      - name: Build and run language initialization failure tests
        run: |
          xmake -v -y LHoloLanguageStoreTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloLanguageStoreTests

      - name: Build and run menu rendering tests
        run: |
          xmake -v -y LHoloUiTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloUiTests

      - name: Build and run D3D11On12 queue binding tests
        run: |
          xmake -v -y LHoloGraphicsTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloGraphicsTests

      - name: Build and run native resource reload ABI v4 tests
        run: |
          xmake -v -y LHoloWorldPackReloadTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloWorldPackReloadTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run translucency tests
        run: |
          xmake -v -y LHoloTranslucencyTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloTranslucencyTests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/
