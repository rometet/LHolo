on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: |
          xmake -v -y

      - name: Build logic tests
        run: |
          xmake -v -y LHoloLogicTests

      - name: Run logic tests
        run: |
          xmake run LHoloLogicTests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/

  manual-regressions:
    # These engine-double tests are separate from the real Windows DLL build.
    # They cannot stand in for that build or Minecraft runtime acceptance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Manual policy, item conversion and input routing
        run: python3 tests/manual/run_tests.py --ubsan
      - name: Placement comparison and negative control
        run: python3 tests/manual/run_prediction_tests.py --ubsan
