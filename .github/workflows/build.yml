on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22.1.8

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: |
          xmake -v -y

      - name: Build logic tests
        run: |
          xmake -v -y LHoloLogicTests

      - name: Run logic tests
        run: |
          xmake run LHoloLogicTests

      - name: Build and run NBT parser tests
        run: |
          xmake -v -y LHoloNbtTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloNbtTests

      - name: Build and run language initialization failure tests
        run: |
          xmake -v -y LHoloLanguageStoreTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloLanguageStoreTests

      - name: Build and run menu rendering tests
        run: |
          xmake -v -y LHoloUiTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloUiTests

      - name: Build and run D3D11On12 queue binding tests
        run: |
          xmake -v -y LHoloGraphicsTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloGraphicsTests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/
