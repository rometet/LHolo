on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: |
          xmake -v -y

      - name: Verify Companion GUI bridge exports
        shell: pwsh
        run: |
          $exports = llvm-readobj --coff-exports bin/LHolo/LHolo.dll
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect LHolo.dll exports' }
          foreach ($name in @('lholo_register_companion_gui_v2', 'lholo_unregister_companion_gui_v2', 'lholo_companion_gui_registered_v2', 'lholo_menu_input_captured_v2', 'lholo_close_companion_gui_v2')) {
            if (-not ($exports | Select-String -SimpleMatch "Name: $name" -Quiet)) { throw "Missing bridge export: $name" }
          }

      - name: Build logic tests
        run: |
          xmake -v -y LHoloLogicTests

      - name: Run logic tests
        run: |
          xmake run LHoloLogicTests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/
