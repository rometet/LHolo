on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}

      - name: Install verified LLVM 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-22.1.8'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe' -OutFile $installer
          $expected = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'LLVM installer checksum mismatch'
          }
          $install = Start-Process -FilePath $installer -ArgumentList "/S /D=$llvmRoot" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
          $llvmBin = Join-Path $llvmRoot 'bin'
          $version = (& (Join-Path $llvmBin 'clang-cl.exe') --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'clang version 22\.1\.8(?:\s|$)') {
            throw "Unexpected LLVM compiler: $version"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: |
          xmake -v -y

      - name: Build logic tests
        run: |
          xmake -v -y LHoloLogicTests

      - name: Run logic tests
        run: |
          xmake run LHoloLogicTests

      - name: Build and run NBT parser tests
        run: |
          xmake -v -y LHoloNbtTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloNbtTests

      - name: Build and run language initialization failure tests
        run: |
          xmake -v -y LHoloLanguageStoreTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloLanguageStoreTests

      - name: Build and run menu rendering tests
        run: |
          xmake -v -y LHoloUiTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloUiTests

      - name: Build and run D3D11On12 queue binding tests
        run: |
          xmake -v -y LHoloGraphicsTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloGraphicsTests

      - name: Build and run translucency tests
        run: |
          xmake -v -y LHoloTranslucencyTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloTranslucencyTests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/
