on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and attach the zip to"
        required: true
        type: string
      publish_assets:
        description: "Replace release notes/assets after validation (leave off to validate only)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Install verified LLVM 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-22.1.8'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe' -OutFile $installer
          $expected = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'LLVM installer checksum mismatch'
          }
          $install = Start-Process -FilePath $installer -ArgumentList "/S /D=$llvmRoot" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
          $llvmBin = Join-Path $llvmRoot 'bin'
          $version = (& (Join-Path $llvmBin 'clang-cl.exe') --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'clang version 22\.1\.8(?:\s|$)') {
            throw "Unexpected LLVM compiler: $version"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=client -y

      - run: |
          xmake -w -y

      - name: Build logic tests
        run: |
          xmake -v -y LHoloLogicTests

      - name: Run logic tests
        run: |
          xmake run LHoloLogicTests

      - name: Build and run NBT parser tests
        run: |
          xmake -v -y LHoloNbtTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloNbtTests

      - name: Build and run language initialization failure tests
        run: |
          xmake -v -y LHoloLanguageStoreTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloLanguageStoreTests

      - name: Build and run menu rendering tests
        run: |
          xmake -v -y LHoloUiTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloUiTests

      - name: Build and run D3D11On12 queue binding tests
        run: |
          xmake -v -y LHoloGraphicsTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloGraphicsTests

      - name: Build and run translucency tests
        run: |
          python tools/Prepare-WaterOrderFixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake -v -y LHoloTranslucencyTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LHoloTranslucencyTests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/

  update-release-notes:
    # Published releases validate the tagged source without replacing accepted assets.
    # Asset/notes updates remain available through an explicit manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_assets == true }}
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref }}
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_assets == true }}
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: artifact

      - run: |
          cp README.md artifact/
          cp LICENSE artifact/ 2>/dev/null || true

      - run: |
          zip -r ../${{ github.event.repository.name }}-client-windows-x64.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref }}
          files: |
            ${{ github.event.repository.name }}-client-windows-x64.zip
